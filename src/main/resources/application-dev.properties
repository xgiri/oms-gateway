# ---------------------------------------------------------------------------
# dev profile — local development (IntelliJ run, mvn spring-boot:run, or
# eventually docker-compose). Mirrors oms-main's application-dev.properties
# Vault block exactly — same dev-mode Vault container, same throwaway token,
# same "optional:" import so a plain local run without Vault up still
# starts fine (falls through to REDIS_PASSWORD being empty/unset, matching
# oms-main's own fallback behavior).
# ---------------------------------------------------------------------------

# The import lives HERE, not in the base application.properties, and
# deliberately in the same file as the authentication/token lines below —
# see the long comment on spring.cloud.vault.enabled in oms-main's
# application.properties for why: an import declared in a profile-
# independent file resolves before profile-specific files like this one are
# even read, so co-locating them here is what makes TOKEN auth actually be
# configured by the time this import fires.
spring.config.import=optional:vault://
spring.cloud.vault.uri=${VAULT_ADDR:http://localhost:8200}
spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.token=${VAULT_TOKEN:oms-dev-root-token}

app.cors.allowed-origins=http://localhost:4200

logging.level.root=INFO
logging.level.com.giri.omsgateway=DEBUG
