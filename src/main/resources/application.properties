spring.application.name=oms-gateway

# Which environment profile to load — mirrors oms-main's own convention
# exactly (see its application.properties). Defaults to dev so a bare
# IntelliJ run / mvn spring-boot:run works out of the box; every real
# deployment should set SPRING_PROFILES_ACTIVE explicitly.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s

# Without this, RateLimiterConfig's clientIpKeyResolver sees whatever
# proxy sits in front of the gateway as the "client" once one exists — in
# k8s that's ingress-nginx (k8s/04-ingress.yaml), so every external caller
# would collapse onto one shared rate-limit bucket (the Ingress pod's own
# IP), defeating per-client login rate limiting silently rather than
# loudly. This tells Spring's WebFlux stack to honor X-Forwarded-For (and
# the standard Forwarded header) and rewrite
# exchange.getRequest().getRemoteAddress() to the real client IP before
# any filter — including clientIpKeyResolver — ever sees the request; no
# change needed in RateLimiterConfig itself.
#
# Trust boundary this assumes: only ingress-nginx can ever reach this app
# directly. Two things hold that up — (1) k8s/03-service-gateway.yaml is
# ClusterIP only, never NodePort/LoadBalancer, so nothing outside the
# cluster can bypass the Ingress and forge this header directly; (2)
# ingress-nginx's own default (use-forwarded-headers: false in its
# ConfigMap) means it recomputes X-Forwarded-For itself from the real TCP
# connection rather than trusting whatever a client already sent, so a
# would-be attacker can't smuggle a fake entry in front of the real one
# either. If your cluster's ingress-nginx has use-forwarded-headers
# flipped to true, that second guarantee no longer holds — worth
# confirming before relying on this in a shared/production environment.
# Locally (no Ingress in the loop, see docker-compose.snippet.yml) this is
# simply a no-op: no forwarded headers arrive, remoteAddress stays the
# direct TCP peer exactly as before.
server.forward-headers-strategy=framework

# CORS ? origins allowed to call this API from a browser. Comma-separated list.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Listed BEFORE oms-monolith below - Spring Cloud Gateway evaluates routes
# in declared (index) order and uses the first match, so this narrower
# Method+Path predicate must win for login requests before the broader
# /api/v1/** route gets a chance to. Per-client-IP rate limiting here: the
# monolith's own Bucket4j login limiter stays in place too for now (defense
# in depth) - this is additive, not a replacement, until you're confident
# enough to retire the monolith-side one.
spring.cloud.gateway.server.webflux.routes[0].id=oms-login
spring.cloud.gateway.server.webflux.routes[0].uri=${OMS_MONOLITH_URI:http://app:8080}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/login
spring.cloud.gateway.server.webflux.routes[0].predicates[1]=Method=POST
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.rate-limiter=#{@loginRateLimiter}
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.key-resolver=#{@clientIpKeyResolver}

# Step 1: pure passthrough to oms-main for everything else. Nothing about
# the request path changes - Angular's existing /api/v1/... calls keep
# working unmodified, just via the gateway's origin instead of the
# monolith's directly.
spring.cloud.gateway.server.webflux.routes[1].id=oms-monolith
spring.cloud.gateway.server.webflux.routes[1].uri=${OMS_MONOLITH_URI:http://app:8080}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/**

# JWKS document itself - must stay reachable without a token.
spring.cloud.gateway.server.webflux.routes[2].id=oms-jwks
spring.cloud.gateway.server.webflux.routes[2].uri=${OMS_MONOLITH_URI:http://app:8080}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/.well-known/jwks.json

# Swagger UI / OpenAPI docs - left open, same as the monolith's own
# SecurityConfig public-paths allowlist.
spring.cloud.gateway.server.webflux.routes[3].id=oms-docs
spring.cloud.gateway.server.webflux.routes[3].uri=${OMS_MONOLITH_URI:http://app:8080}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/docs,/docs/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

# Step 2: oms-bff, the GraphQL aggregation layer. /graphql goes through the
# same JWT-authenticated path as /api/v1/** below (it's not in
# SecurityConfig's PUBLIC_PATHS), so AuthHeaderForwardingFilter has already
# populated X-Auth-User/X-Auth-Roles by the time this route dispatches -
# oms-bff trusts those instead of re-verifying the JWT itself, see its
# SecurityConfig. /graphiql (dev-only explorer UI on the oms-bff side) is
# routed too, permitAll'd below same as oms-main's docs, for the same
# reason: it's a static page, and the queries it submits still hit /graphql
# and still need the header.
spring.cloud.gateway.server.webflux.routes[4].id=oms-bff
spring.cloud.gateway.server.webflux.routes[4].uri=${OMS_BFF_URI:http://bff:8095}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/graphql,/graphiql,/graphiql/**

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}

# Points at oms-main's own published JWKS - the gateway never holds a
# shared secret or the private signing key, only ever the public
# verification key.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OMS_JWKS_URI:http://app:8080/.well-known/jwks.json}

server.port=${SERVER_PORT:8090}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

management.server.port=${MANAGEMENT_SERVER_PORT:8091}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
# The gateway actuator endpoint (/actuator/gateway/**) is deliberately NOT
# exposed here, and NOT in SecurityConfig's PUBLIC_PATHS - see
# CVE-2025-41243/41253 (SpEL injection via this exact endpoint), and
# /actuator/gateway/routes leaks internal routing topology regardless of
# that CVE. Re-enable only temporarily, only for local (non-prod-profile)
# debugging, and remove again before committing/deploying - ActuatorExposureGuard
# refuses to start under the prod profile if this ever ends up left in:
#   management.endpoints.web.exposure.include=health,info,prometheus,gateway
#   management.endpoint.gateway.access=read-only

app.ratelimit.login.replenish-rate=5
app.ratelimit.login.burst-capacity=5

# HashiCorp Vault — same off-by-default, per-profile-turns-it-on pattern as
# oms-main (see its application.properties for the full rationale on why
# the import itself lives in the profile file, not here). Base file only
# sets the flag; application-dev.properties supplies the actual
# import/auth/token.
spring.cloud.vault.enabled=${VAULT_ENABLED:false}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.backend-version=2
# Deliberately overridden to "oms" rather than left at the default
# (spring.application.name = "oms-gateway", which would resolve to
# secret/oms-gateway/<profile>). The gateway's only secret today
# (REDIS_PASSWORD) is the exact same value oms-main already reads from
# secret/oms/<profile> - pointing both apps at the same KV path means one
# secret, one rotation, no duplicate entry to keep in sync in Vault. If the
# gateway ever grows a secret that's genuinely its own (not shared with
# oms-main), give that one its own path explicitly rather than moving this
# default-context override.
spring.cloud.vault.kv.default-context=oms

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
