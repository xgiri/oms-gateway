# ---------------------------------------------------------------------------
# prod profile. Mirrors oms-main's application-prod.properties Vault block —
# same fail-fast reasoning: an unreachable Vault stops the deploy rather than
# starting the gateway with an empty REDIS_PASSWORD. Kubernetes auth against
# this pod's own ServiceAccount (see k8s/12-serviceaccount.yaml), not a
# static token.
#
# Deliberately its own role name (oms-gateway-prod), distinct from
# oms-main's oms-app-prod, even though both currently resolve to the same
# underlying policy/path (secret/oms/prod — see pom.xml's
# spring.cloud.vault.kv.default-context=oms comment for why the KV path
# itself is shared). A separate role means the gateway's ServiceAccount can
# be revoked or re-scoped independently of oms-main's without touching the
# other. See vault/README.md's "Vault role for oms-gateway" section for the
# one-time server-side setup this assumes already exists.
# ---------------------------------------------------------------------------

logging.level.root=WARN
logging.level.com.giri.omsgateway=INFO

spring.config.import=vault://
spring.cloud.vault.enabled=true
spring.cloud.vault.uri=${VAULT_ADDR}
spring.cloud.vault.authentication=KUBERNETES
spring.cloud.vault.kubernetes.role=${VAULT_KUBERNETES_ROLE:oms-gateway-prod}
spring.cloud.vault.kubernetes.kubernetes-path=${VAULT_KUBERNETES_AUTH_PATH:kubernetes}
