spring:
  application:
    name: oms-gateway

  cloud:
    gateway:
      # httpclient/webclient timeouts — a slow/hung monolith shouldn't hang
      # the gateway's own event-loop threads indefinitely.
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s
      routes:
        # Listed BEFORE the general oms-monolith route below — Spring Cloud
        # Gateway evaluates routes in declared order and uses the first
        # match, so this narrower Method+Path predicate must win for login
        # requests before the broader /api/v1/** route gets a chance to.
        # Per-client-IP rate limiting here: the monolith's own Bucket4j
        # login limiter stays in place too for now (defense in depth) —
        # this is additive, not a replacement, until you're confident
        # enough to retire the monolith-side one.
        - id: oms-login
          uri: ${OMS_MONOLITH_URI:http://app:8080}
          predicates:
            - Path=/api/v1/auth/login
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@loginRateLimiter}"
                key-resolver: "#{@clientIpKeyResolver}"

        # Step 1: pure passthrough to oms-main for everything else.
        # Nothing about the request path changes — Angular's existing
        # /api/v1/... calls keep working unmodified, just via the
        # gateway's origin instead of the monolith's directly.
        - id: oms-monolith
          uri: ${OMS_MONOLITH_URI:http://app:8080}
          predicates:
            - Path=/api/v1/**

        # JWKS document itself — must stay reachable without a token (a
        # verifier has to be able to fetch the public key before it can
        # verify anything).
        - id: oms-jwks
          uri: ${OMS_MONOLITH_URI:http://app:8080}
          predicates:
            - Path=/.well-known/jwks.json

        # Swagger UI / OpenAPI docs — left open, same as the monolith's own
        # SecurityConfig public-paths allowlist (disabled outright in prod
        # there, so this route is harmless to leave configured everywhere).
        - id: oms-docs
          uri: ${OMS_MONOLITH_URI:http://app:8080}
          predicates:
            - Path=/docs,/docs/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

  security:
    oauth2:
      resourceserver:
        jwt:
          # Points at oms-main's own published JWKS — the gateway never
          # holds a shared secret or the private signing key, only ever the
          # public verification key, exactly the trust model the JWKS
          # endpoint's own Javadoc describes.
          jwk-set-uri: ${OMS_JWKS_URI:http://app:8080/.well-known/jwks.json}

server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 30s

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

app:
  ratelimit:
    login:
      # Mirrors oms-main's Bucket4j login limiter defaults (5 requests /
      # 60s) — see application.properties there. Kept in sync deliberately;
      # if you tune one, tune the other until the monolith-side limiter is
      # retired.
      replenish-rate: 5
      burst-capacity: 5

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
