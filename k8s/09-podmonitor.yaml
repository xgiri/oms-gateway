# Optional — only applies if you run Prometheus Operator (i.e. the
# monitoring.coreos.com/v1 CRDs are installed). If you're using plain
# Prometheus with annotation-based discovery instead, the
# prometheus.io/scrape annotations already on 02-deployment-gateway.yaml's
# pod template cover it and this file isn't needed — same either/or as
# oms-main's 09-podmonitor.yaml.
#
# Own PodMonitor (not folded into oms-main's) because the two are separate
# deployables with separate labels (app.kubernetes.io/name: oms-gateway vs
# oms) — one selector can't cover both without widening it to match
# unrelated pods.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: oms-gateway
  labels:
    app.kubernetes.io/name: oms-gateway
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: oms-gateway
  podMetricsEndpoints:
    - port: metrics   # matches the "metrics" containerPort (8091)
      path: /actuator/prometheus
      interval: 30s
