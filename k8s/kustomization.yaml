apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-configmap.yaml
  # No secret manifest here, unlike oms-main's 01-secret.example.yaml — the
  # gateway's only secret (REDIS_PASSWORD) comes entirely from Vault (see
  # ../vault/README.md), nothing plain-k8s-Secret-shaped left over the way
  # oms-main still needs one for KEDA's TriggerAuthentication.
  - 12-serviceaccount.yaml
  - 02-deployment-gateway.yaml
  - 03-service-gateway.yaml
  - 04-ingress.yaml
  - 05-hpa-gateway.yaml
  - 08-pdb.yaml
  # - 09-podmonitor.yaml   # requires Prometheus Operator CRDs — uncomment if you run it

# Convenience for CI: `kustomize edit set image oms-gateway=your-registry/oms-gateway:$GIT_SHA`
images:
  - name: your-registry.example.com/oms-gateway
    newName: your-registry.example.com/oms-gateway
    newTag: REPLACE_ME
