# Dedicated ServiceAccount (not oms-main's oms-app, not the namespace's
# `default`) so the Vault Kubernetes-auth role scoped to this pod can be
# bound narrowly and revoked/re-scoped independently of oms-main's own SA.
# See ../vault/README.md's "Vault role for oms-gateway" section for the
# `vault write auth/kubernetes/role/oms-gateway-prod ...` step this backs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oms-gateway
  labels:
    app.kubernetes.io/name: oms-gateway
