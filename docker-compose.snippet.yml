# Add this service to the root docker-compose.yml, alongside `app` /
# `app-worker`. Not wired in automatically — review against your actual
# .env and `oms-network` setup first.

  gateway:
    image: oms-gateway:${GATEWAY_VERSION:-local}
    build:
      context: ./oms-gateway
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        APP_VERSION: ${GATEWAY_VERSION:-local}
    container_name: oms-gateway
    restart: unless-stopped
    ports:
      - "8090:8090"
      - "8091:8091"
    environment:
      OMS_MONOLITH_URI: http://app:8080
      OMS_JWKS_URI: http://app:8080/.well-known/jwks.json
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8091/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - oms-network
