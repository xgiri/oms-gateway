# Add this service to the root docker-compose.yml, alongside `app` /
# `app-worker` / `bff`. Depends on `bff` (for OMS_BFF_URI routing) and
# `shipment-service` (for OMS_SHIPMENT_SERVICE_URI routing) too — merge
# oms-bff's and shipment-service's own snippets in first if they aren't
# already. Not wired in automatically — review against your actual .env and
# `oms-network` setup first.

  gateway:
    image: oms-gateway:${GATEWAY_VERSION:-local}
    build:
      context: ./oms-gateway
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        APP_VERSION: ${GATEWAY_VERSION:-local}
    container_name: oms-gateway
    restart: unless-stopped
    ports:
      - "8090:8090"
      - "8091:8091"
    environment:
      OMS_MONOLITH_URI: http://app:8080
      OMS_JWKS_URI: http://app:8080/.well-known/jwks.json
      OMS_BFF_URI: http://bff:8095
      OMS_SHIPMENT_SERVICE_URI: http://shipment-service:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # REDIS_PASSWORD no longer passed directly — Vault supplies it from
      # secret/oms/dev, the same path oms-main itself reads (see
      # spring.cloud.vault.kv.default-context=oms in the gateway's
      # application.properties). VAULT_TOKEN below is the same dev-mode
      # root token oms-main's app/app-worker services already use.
      VAULT_ENABLED: "true"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-oms-dev-root-token}
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      bff:
        condition: service_healthy
      shipment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8091/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - oms-network
